<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}Split Expenses{% endblock %}</title>
    <meta name="description" content="Split travel and pilgrimage expenses with your group. No login required — just share the link.">

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0d9488">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <a href="{{ url_for('main.index') }}" class="logo" id="nav-logo">
                <span class="logo-icon">💰</span>
                <span class="logo-text">Split<span class="logo-highlight">Exp</span></span>
            </a>
            <button class="install-btn" id="install-btn" style="display: none;">
                <span class="install-icon">📲</span> Install App
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% if error_404 is defined and error_404 %}
            <div class="error-page">
                <div class="error-icon">🔍</div>
                <h1>Group Not Found</h1>
                <p>This group doesn't exist or the link may be incorrect.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">Create New Group</a>
            </div>
            {% else %}
                {% block content %}{% endblock %}
            {% endif %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>Split Expenses &mdash; Share costs, not worries ✨</p>
        </div>
    </footer>

    <div class="offline-banner" id="offline-banner">
        <span>📴 You're offline — viewing cached data</span>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}', {
                scope: '/'
            }).catch(function(err) {
                console.log('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
